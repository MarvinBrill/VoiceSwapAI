[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["engine/rvc", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402"]
"backend/tests/test_training_audio.py" = ["E402"]
"backend/tests/test_retrieval.py" = ["E402"]
"backend/tests/test_sine_generation.py" = ["E402"]
